<nav class="navbar">
    <ng-container *ngFor="let item of menuItems">
        <button mat-button [matMenuTriggerFor]="subMenu" [routerLink]="item.route" routerLinkActive="active-link">
            {{ item.label }}
        </button>

        <mat-menu #subMenu="matMenu">
            <button mat-menu-item *ngFor="let child of item.children" [routerLink]="child.route">
                {{ child.label }}
            </button>
        </mat-menu>
    </ng-container>
</nav>
