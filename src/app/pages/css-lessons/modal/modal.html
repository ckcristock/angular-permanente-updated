<p>Modal exercises</p>
<mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
    <mat-tab label="First">
        <button class="btn btn-primary" (click)="openModal1()">Open Modal</button>
        @if (modal1Open) {
            <app-ngifmodal [title]="'My title'" [message]="'This is a message'" 
            (close)="closeModal1($event)"></app-ngifmodal>
        }
    </mat-tab>
    <mat-tab label="Second">Content 2</mat-tab>
    <mat-tab label="Third">Content 3</mat-tab>
</mat-tab-group>
